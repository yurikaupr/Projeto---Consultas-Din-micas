<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>QueryHub | Sucesso do Cliente · Magazord</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-mode="viewer">

  <div class="brand-strip"></div>

  <!-- ========== Header ========== -->
  <header class="header">
    <div class="container header__inner">
      <div class="brand">
        <span class="brand__symbol"><i></i><i></i><i></i><i></i></span>
        <div>
          <strong class="brand__name">QueryHub</strong>
          <small class="brand__sub">Sucesso do Cliente · Magazord</small>
        </div>
      </div>

      <div class="header__actions">
        <span class="user hidden" id="userBox">
          <span class="user__email" id="userEmail"></span>
          <button type="button" class="link-btn" id="btnLogout">Sair</button>
        </span>
        <a class="btn btn--primary hidden" id="adminLink" href="admin.html">Painel admin</a>
      </div>
    </div>
  </header>

  <main class="container">

    <section class="hero">
      <h1 class="hero__title">Consultas do time de Sucesso</h1>
      <p class="hero__text">
        Encontre a consulta pelo assunto, confira as colunas e filtros e baixe o JSON pronto para importar.
      </p>
    </section>

<section class="toolbar">
      <label class="search">
        <svg class="search__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="search" id="searchInput" class="search__input" placeholder="Buscar por nome, descrição ou coluna  ( / )" autocomplete="off">
      </label>

      <select id="sortSelect" class="select" aria-label="Ordenar consultas">
        <option value="name">Nome (A–Z)</option>
        <option value="recent">Mais recentes</option>
      </select>
    </section>

    <div class="chips" id="categoryChips" role="group" aria-label="Filtrar por categoria"></div>

    <div class="results-head">
      <label class="results-head__select">
        <input type="checkbox" id="selectAll">
        <strong>Biblioteca de consultas</strong>
        <span id="resultCount">0 consultas</span>
      </label>
      <button type="button" class="link-btn" id="btnZipList">Baixar lista em ZIP</button>
    </div>

    <section class="query-list" id="queryList"></section>

    <div class="empty hidden" id="emptyState">
      <p class="empty__title" id="emptyTitle"></p>
      <p class="empty__text" id="emptyText"></p>
    </div>
  </main>

  <!-- ========== Barra de seleção ========== -->
  <div class="bulk hidden" id="bulkBar">
    <strong id="bulkCount">0 selecionadas</strong>
    <div class="bulk__actions">
      <button type="button" class="btn btn--sm" id="bulkZip">Baixar ZIP</button>
      <button type="button" class="btn btn--sm" id="bulkClear">Limpar seleção</button>
    </div>
  </div>

<!-- ========== Drawer de detalhes ========== -->
  <div class="overlay hidden" id="drawerOverlay"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawerTitle">
    <div class="drawer__head">
      <div class="drawer__headline">
        <div>
          <div class="badges" id="drawerBadges"></div>
          <h2 class="drawer__title" id="drawerTitle"></h2>
        </div>
        <button type="button" class="icon-btn" id="drawerClose" aria-label="Fechar">×</button>
      </div>
      <p class="drawer__desc" id="drawerDesc"></p>
      <div class="drawer__actions">
        <button type="button" class="btn btn--primary" id="drawerDownload">Baixar JSON</button>
        <button type="button" class="btn" id="drawerFav">☆ Favoritar</button>
</div>
    </div>

    <div class="drawer__body">
      <section class="block">
        <h3 class="block__title">Filtros necessários</h3>
        <div id="drawerFilters"></div>
      </section>

      <section class="block">
        <div class="block__head">
          <h3 class="block__title" id="drawerColsTitle">Colunas</h3>
          <div class="block__tools">
            <input type="search" id="colSearch" class="mini-input" placeholder="Filtrar colunas">
            <button type="button" class="link-btn" id="copyCols">Copiar nomes</button>
          </div>
        </div>
        <div class="col-grid" id="drawerCols"></div>
      </section>
    </div>
  </aside>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/vendor/jszip.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
