<!DOCTYPE html>
<html lang="pt-BR" data-build="3.2.0">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Entrar | QueryHub</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="js/theme.js?v=3.2.0"></script>
  <style>/* proteção: mesmo com um CSS antigo, o fundo não escurece e os ícones não explodem */.overlay{opacity:0;visibility:hidden}.overlay.is-open{opacity:1;visibility:visible}.theme-btn .ico{display:none;width:18px;height:18px}:root[data-theme-mode=auto] .theme-btn .ico-auto,:root[data-theme-mode=light] .theme-btn .ico-light,:root[data-theme-mode=dark] .theme-btn .ico-dark{display:block}</style>
  <link rel="stylesheet" href="css/style.css?v=3.2.0">
  <link rel="stylesheet" href="css/login.css?v=3.2.0">
</head>
<body>
  <div class="brand-strip"></div>

  <button type="button" class="icon-btn theme-btn login__theme" data-theme-toggle aria-label="Alternar tema">
    <svg class="ico ico-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
    <svg class="ico ico-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="ico ico-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>

  <main class="login">
    <section class="login__card">
      <div class="brand login__brand">
        <span class="brand__symbol"><i></i><i></i><i></i><i></i></span>
        <div>
          <strong class="brand__name">QueryHub</strong>
          <small class="brand__sub">Sucesso do Cliente · Magazord</small>
        </div>
      </div>

      <h1 class="login__title">Entrar</h1>
      <p class="login__text" id="loginText">Use sua conta Google corporativa para acessar a biblioteca de consultas.</p>

      <div class="login__button" id="googleButton"></div>
      <p class="login__error" id="loginError" role="alert"></p>
      <p class="login__legal"><a href="privacidade.html">Política de Privacidade</a></p>
    </section>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="js/login.js?v=3.2.0"></script>
</body>
</html>
